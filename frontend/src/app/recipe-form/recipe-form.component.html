<div class="form-container">
  <h2>{{ isEditMode ? 'Edit Recipe' : 'Add Recipe' }}</h2>

  <input [(ngModel)]="recipe.title" placeholder="Title">

  <input [(ngModel)]="recipe.description" placeholder="Description">

  <label>Category:</label>
  <select [(ngModel)]="recipe.category">
    <option *ngFor="let category of recipeCategories" [value]="category.value">
      {{ category.label }}
    </option>
  </select>

  <input type="number" [(ngModel)]="recipe.servings" placeholder="Servings" min="1">

  <textarea [(ngModel)]="recipe.instructions" placeholder="Instructions"></textarea>

  <label>Image:</label>
  <input type="file" (change)="onFileChange($event, 'image')">

  <label>PDF:</label>
  <input type="file" (change)="onFileChange($event, 'pdf_file')">

  <h3>Select Ingredients</h3>

  <div *ngFor="let item of items" class="ingredient-row">
    <label>
      <input
        type="checkbox"
        [checked]="isIngredientSelected(item.id)"
        (change)="toggleIngredient(item)"
      >
      {{ item.name }}
    </label>

    <input
      *ngIf="isIngredientSelected(item.id)"
      type="text"
      [(ngModel)]="getSelectedIngredient(item.id).quantity"
      placeholder="Quantity"
      class="ingredient-quantity"
    >
  </div>

  <button (click)="submit()">
    {{ isEditMode ? 'Update' : 'Add' }}
  </button>
</div>
