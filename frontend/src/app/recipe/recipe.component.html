<h2>Recipes</h2>

<div *ngIf="recipes.length === 0">
  No recipes found.
</div>

<div *ngFor="let recipe of recipes" class="card">
  <h3>{{ recipe.title }}</h3>

  <img 
    *ngIf="recipe.image"
    [src]="'http://127.0.0.1:8000' + recipe.image"
    width="200"
  >

  <p>{{ recipe.description }}</p>

  <button [routerLink]="['/recipe', recipe.id]">View</button>
</div>
